<!doctype html>

<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./main.js"></script>
    <title>SVG Map</title>
  </head>
  <body>
    <dialog id="minimap_dialog">
      <button title="Close"></button>
      <p>Salvataggio fallito.</p>
    </dialog>

    <div style = "display: flex; flex-direction: column; width: fit-content; gap: 5px; padding: 20px;">
      <div style = "display: flex; gap: 5px;">
        <button id="yaw_DX" style="width: 100%;">DX</button>
        <button id="yaw_SX" style="width: 100%;">SX</button>
      </div>
      <button id="change_pano">PANO NEW</button>
      <button id="change_pano_new_set">PANO NEW SET</button>
      <button id="change_pano_new_tour">PANO NEW TOUR</button>
    </div>
    

    <div id="minimap_container">
      <div id="map_container" class="simple_container map_container hidden">
        <svg xmlns="http://www.w3.org/2000/svg" version="1.1" id="map_svg"></svg>
        <div id="map_controls" class="controls"></div>
      </div>
      <div id="map_open" class="simple_container">
        <button id="btn_map_open" class="map_control_btn map_open_btn" title="Open map editor"></button>
      </div>
    </div>
  </body>
</html>
